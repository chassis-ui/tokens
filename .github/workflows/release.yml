name: Release

# On a push to main, publishes the version in packages/tokens/package.json when npm does not
# have it yet, then creates its GitHub release from its CHANGELOG entry, with the Android
# library of every app and brand attached. The tag of the release, v<version>, is the version
# that Swift Package Manager resolves. The version and the CHANGELOG are made on develop with
# Changesets. See "Releases" in CONTRIBUTING.md.
#
# The checks of ci.yml ran on this commit when it was pushed to develop, and the ruleset of
# main requires them before the commit can reach main. This workflow does not run them again.
# It reads their results and stops unless each one passed.
#
# npm trusted publishing: the package trusts this workflow file of chassis-ui/tokens, so no
# npm token is needed, and every version has provenance. Renaming this file breaks publishing
# until the trusted publisher on npmjs.com is updated to match.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be publishing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    # A manual run on another branch stops here
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.npm.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prerelease such as 0.7.0-next.0 goes to the dist-tag `next`, and a version without a
      # prerelease part to `latest`. A numeric prerelease such as 0.7.0-0 goes to `next`,
      # because npm rejects a dist-tag that is a version range.
      - name: Read the version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/tokens/package.json').version")
          PRERELEASE=${VERSION#*-}

          if [ "$PRERELEASE" = "$VERSION" ]; then
            DIST_TAG=latest
          else
            DIST_TAG=${PRERELEASE%%.*}
            case "$DIST_TAG" in
              '' | *[!0-9A-Za-z-]* | [0-9]*) DIST_TAG=next ;;
            esac
          fi

          {
            echo "version=$VERSION"
            echo "dist-tag=$DIST_TAG"
            echo "prerelease=$([ "$DIST_TAG" = latest ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, dist-tag $DIST_TAG"

      - name: Check whether npm has the version
        id: npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@chassis-ui/tokens@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "npm has $VERSION. Nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "npm does not have $VERSION. It will be published."
          fi

  checks:
    name: Checks Passed
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      # The native jobs run only when a push to develop changes the tokens, the build, the
      # output or the checks, which the version commit does. A commit that does not change
      # them has no result of theirs, or a skipped one, and is not published until a manual
      # run of ci.yml on it passed: the commit before it may have failed them.
      - name: Read the results of CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: |
            Tokens (Node 22)
            Tokens (Node 24)
            Site
            Native iOS
            Native Android
        run: |
          RESULTS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name')
          MISSING=0

          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue

            if printf '%s\n' "$RESULTS" | grep -qxF "$NAME"; then
              echo "passed: $NAME"
            else
              echo "::error::The check '$NAME' has not passed on $GITHUB_SHA"
              MISSING=1
            fi
          done <<< "$REQUIRED"

          exit $MISSING

  publish:
    name: Publish
    needs: [detect, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release and its tag
      id-token: write # for npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node.js 24 ships npm 11, which trusted publishing needs (11.5.1 or later)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/tokens

      # Fails when the committed dist/ differs from a fresh build of source/
      - name: Verify dist/
        run: pnpm tokens:verify

      # Before publishing, so a version without a CHANGELOG entry is not published
      - name: Release notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: node build/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Checks the Gradle wrapper against Gradle's checksums. No cache: a release builds
      # from the published packages only
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Before publishing, so a version whose Android libraries do not build is not
      # published: chassis-tokens-<app>-<brand>-<version>.aar in library/build/aars/
      - name: Build the Android libraries
        working-directory: packages/tokens/test/native/android
        run: |
          ./gradlew :library:aars
          ls library/build/aars/*.aar

      - name: Publish to npm
        working-directory: packages/tokens
        env:
          DIST_TAG: ${{ needs.detect.outputs.dist-tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      # Runs only when the publish step succeeded. The tag is v<version>, without the package
      # name: Swift Package Manager resolves it as the version of the Swift package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi

          gh release create "v$VERSION" \
            packages/tokens/test/native/android/library/build/aars/*.aar \
            --target "$GITHUB_SHA" \
            --title "@chassis-ui/tokens v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"
