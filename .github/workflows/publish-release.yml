name: Publish Release

# On a push to main, after the checks of ci.yml pass on that commit:
# - Pending changesets (.changeset/*.md): open or update the "Version Packages" pull request,
#   which bumps the version, writes the CHANGELOG, the site's currentVersion and the dist/
#   headers. Merging it pushes main again, and that run publishes.
# - A version in packages/tokens/package.json that is not on npm yet: publish it with npm trusted
#   publishing (no npm token) and provenance, then create the GitHub release from its CHANGELOG
#   entry, with the Android library of every app and brand attached. The tag of the release is
#   the version that Swift Package Manager resolves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be publishing
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  # The checks of ci.yml; nothing is versioned or published unless they pass on this commit
  ci:
    uses: ./.github/workflows/ci.yml

  detect-changes:
    needs: ci
    # A manual run on another branch checks it and stops here
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      tokens-changed: ${{ steps.npm-check.outputs.tokens-changed }}
      tokens-version: ${{ steps.version.outputs.tokens-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for changesets
        id: changesets
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
            echo "Changesets found, will open or update the Version Packages pull request"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            echo "No changesets"
          fi

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/tokens/package.json').version")
          echo "tokens-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published on npm
        id: npm-check
        env:
          VERSION: ${{ steps.version.outputs.tokens-version }}
        run: |
          if npm view "@chassis-ui/tokens@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "tokens-changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm, skipping publish"
          else
            echo "tokens-changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on npm, will publish"
          fi

  version:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to push the version commit to the changeset-release/main branch
      pull-requests: write # to open or update the Version Packages pull request
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CHANGELOG names the commit that added each changeset
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # The build's packages too: the version step rebuilds dist/ for its version header
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/tokens

      - name: Open or update the Version Packages pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm changeset:version

  publish-tokens:
    needs: detect-changes
    if: needs.detect-changes.outputs.tokens-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the GitHub release and its tag
      id-token: write # for npm trusted publishing and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node.js 24 ships npm 11, which trusted publishing needs (11.5.1 or later)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/tokens

      # Fails when the committed dist/ differs from a fresh build of source/
      - name: Verify dist/
        run: pnpm tokens:verify

      # Before publishing, so a version without a CHANGELOG entry is not published
      - name: Release notes
        env:
          VERSION: ${{ needs.detect-changes.outputs.tokens-version }}
        run: node build/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Checks the Gradle wrapper against Gradle's checksums. No cache: a release builds
      # from the published packages only
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # Before publishing, so a version whose Android libraries do not build is not
      # published: chassis-tokens-<app>-<brand>-<version>.aar in library/build/aars/
      - name: Build the Android libraries
        working-directory: packages/tokens/test/native/android
        run: ./gradlew :library:aars

      - name: Publish @chassis-ui/tokens
        working-directory: packages/tokens
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: 'v${{ needs.detect-changes.outputs.tokens-version }}'
          name: '@chassis-ui/tokens v${{ needs.detect-changes.outputs.tokens-version }}'
          body_path: ${{ runner.temp }}/release-notes.md
          files: packages/tokens/test/native/android/library/build/aars/*.aar
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
