name: Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be publishing
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  # The checks of ci.yml; nothing is published unless they pass on this commit
  ci:
    uses: ./.github/workflows/ci.yml

  detect-changes:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tokens-changed: ${{ steps.npm-check.outputs.tokens-changed }}
      tokens-version: ${{ steps.version.outputs.tokens-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tokens-version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published on npm
        id: npm-check
        env:
          VERSION: ${{ steps.version.outputs.tokens-version }}
        run: |
          if npm view "@chassis-ui/tokens@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "tokens-changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already on npm, skipping publish"
          else
            echo "tokens-changed=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION not on npm, will publish"
          fi

  publish-tokens:
    needs: detect-changes
    if: needs.detect-changes.outputs.tokens-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails when the committed dist/ differs from a fresh build of tokens/
      - name: Verify dist/
        run: pnpm tokens:verify

      - name: Publish @chassis-ui/tokens
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CHASSIS_UI }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: 'v${{ needs.detect-changes.outputs.tokens-version }}'
          name: '@chassis-ui/tokens v${{ needs.detect-changes.outputs.tokens-version }}'
          body: |
            Published @chassis-ui/tokens v${{ needs.detect-changes.outputs.tokens-version }} to npm.

            Install with:
            ```bash
            npm install @chassis-ui/tokens@${{ needs.detect-changes.outputs.tokens-version }}
            ```
          draft: false
          prerelease: false
