name: CI

on:
  push:
    # A commit reaches `main` only after these checks passed on it, so they run on `develop`
    # first. Their results belong to the commit, and the ruleset of `main` and the release
    # workflow read them there, so pushing the same commit to `staging` or `main` does not
    # run them again. See "Releases" in CONTRIBUTING.md.
    branches: [develop]
  pull_request:
    # Contributors open pull requests against `develop`
    branches: [develop, staging, main]
  # A manual run always runs the native jobs: the way to run them on a commit that does not
  # change the native paths, which a release needs. See "Releases" in CONTRIBUTING.md.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running one. A push to `develop` always
# runs to the end: the ruleset and the release workflow read the results of that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset of `main` requires Tokens (Node 22), Tokens (Node 24) and Site by these names,
  # and release.yml reads them and the two native jobs. Rename a job in all three places.
  tokens:
    name: Tokens (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The tokens package and the root's lint tools, not the site: the build must not
      # depend on the site's packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/tokens

      - name: Lint
        run: pnpm tokens:lint

      # Mistakes in source/ that the build would accept, named by token set and token
      - name: Lint token source
        run: pnpm tokens:lint:source

      # checkJs on build/ with the types of Style Dictionary and Node.js 22
      - name: Type check
        run: pnpm tokens:typecheck

      - name: Test
        run: pnpm tokens:test

      # Fails when the committed dist/ differs from a fresh build of tokens/
      - name: Verify dist/
        run: pnpm tokens:verify

      - name: Verify presets
        run: pnpm tokens:verify:presets

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint:prettier

      - name: Lint
        run: pnpm site:lint

      - name: Astro check
        run: pnpm check:astro

      # The same build as Vercel: syncs and builds vendor/assets, then Astro and Pagefind
      - name: Build
        run: pnpm site:build

      - name: Validate HTML
        run: pnpm site:lint:html

  # A change to source, packages/tokens/build or packages/tokens/dist needs a changeset;
  # `pnpm changeset --empty` adds one that releases nothing. Changesets checks build and dist
  # (changedFilePatterns in .changeset/config.json). It matches files inside a package only, so
  # the step checks source, at the root, by itself. A pull request is compared with its base
  # branch, a push to develop with the tip it replaced. The version commit consumes the
  # changesets, so a push that changes the version is skipped.
  changeset:
    name: Changeset
    # A manual run has nothing to compare with
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares with an earlier commit
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter chassis-tokens-workspace

      - name: Check for a changeset
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No earlier commit to compare with"
              exit 0
            fi

            PACKAGE_JSON=packages/tokens/package.json
            OLD_VERSION=$(git show "$BEFORE:$PACKAGE_JSON" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            NEW_VERSION=$(node -p 'require("./packages/tokens/package.json").version')
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "The push changes the version ($OLD_VERSION → $NEW_VERSION): a version step, which consumes changesets"
              exit 0
            fi

            SINCE="$BEFORE"
          fi

          # Changesets does not see source/, which is outside the package
          if [ -n "$(git diff --name-only "$SINCE...HEAD" -- source)" ] &&
            [ -z "$(git diff --name-only --diff-filter=A "$SINCE...HEAD" -- '.changeset/*.md')" ]; then
            echo "::error::source/ changed but no changeset was added. Run \`pnpm changeset\`, or \`pnpm changeset --empty\` if the change releases nothing."
            exit 1
          fi

          pnpm changeset status --since "$SINCE"

  # What the pull request does to the tokens, in the job summary: the names added, removed,
  # renamed and changed in each dist/ file. It compares the committed dist/ of the test merge
  # commit with that of its first parent, the base branch; the Tokens job checks that both
  # equal a fresh build. Needs no install: build/diff.js uses Node.js only.
  token-diff:
    name: Token Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed, so there is no store to cache
          package-manager-cache: false

      - name: Token diff report
        run: |
          node packages/tokens/build/diff.js --base HEAD^1 > "$RUNNER_TEMP/token-diff.md"
          cat "$RUNNER_TEMP/token-diff.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/token-diff.md"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing: the automatic cache of setup-node finds no pnpm
          # store to save, and its post step fails the job
          package-manager-cache: false

      # Blocking: what is installed with @chassis-ui/tokens reaches every app that uses it
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the build, test and site tooling never ships in the package
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Whether the native jobs run. A pull request and a push to develop run them only when they
  # change the token source, the build, the output, the preset baselines or the checks
  # themselves, because macOS minutes cost ten times Linux minutes. A pull request is compared
  # with its base branch, a push to develop with the tip it replaced. A manual run always
  # runs them. release.yml publishes a commit only when both passed on it: the version commit
  # changes dist/ and package.json, so they run on it by themselves, and a commit pushed on
  # top of it that does not change these paths needs a manual run.
  native-changes:
    name: Native Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request needs the merge commit and its parents, a push the tip it replaced
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "A manual run, the native jobs run"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$EVENT_NAME" = pull_request ]; then
            # The test merge commit against its first parent, the base branch
            SINCE=HEAD^1
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with, the native jobs run"
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            SINCE="$BEFORE"
          fi

          changed=$(git diff --name-only "$SINCE" HEAD -- \
            source \
            packages/tokens/build \
            packages/tokens/dist \
            packages/tokens/test/golden \
            packages/tokens/test/native \
            packages/tokens/package.json \
            Package.swift \
            .github/workflows/ci.yml)

          if [ -n "$changed" ]; then
            echo "$changed"
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change to the tokens, the build, the output or the native checks"
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  # The Swift files against the iOS simulator SDK (UIKit and SwiftUI), the asset catalogs
  # with actool, and a sample that depends on the libraries of Package.swift and reads
  # their tokens. Needs no install: a shell script
  native-ios:
    name: Native iOS
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile the iOS output
        run: packages/tokens/test/native/ios/check.sh

  # The Android resources, compiled and linked against android.jar, the Compose objects
  # against Jetpack Compose, and a sample app that depends on the Android libraries of the
  # release and reads their resources, with the Gradle project of test/native/android. The
  # runner has the Android SDK
  native-android:
    name: Native Android
    needs: native-changes
    if: needs.native-changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Checks the Gradle wrapper against Gradle's checksums and caches Gradle's downloads,
      # with the open source cache of the action
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Compile the Android output
        working-directory: packages/tokens/test/native/android
        run: ./gradlew compileTokens
