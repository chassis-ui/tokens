name: CI

# Pull requests run this workflow directly. Pushes to main run it through
# publish-release.yml, which publishes only after these jobs pass.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tokens:
    name: Tokens (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The tokens package and the root's lint tools, not the site: the build must not
      # depend on the site's packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @chassis-ui/tokens

      - name: Lint
        run: pnpm tokens:lint

      - name: Test
        run: pnpm tokens:test

      # Fails when the committed dist/ differs from a fresh build of tokens/
      - name: Verify dist/
        run: pnpm tokens:verify

      - name: Verify presets
        run: pnpm tokens:verify:presets

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm lint:prettier

      - name: Lint
        run: pnpm site:lint

      - name: Astro check
        run: pnpm check:astro

      # The same build as Vercel: syncs and builds vendor/assets, then Astro and Pagefind
      - name: Build
        run: pnpm site:build

  # A pull request that changes packages/tokens/source, build or dist needs a changeset
  # (changedFilePatterns in .changeset/config.json); `pnpm changeset --empty` adds one that
  # releases nothing. The Version Packages pull request consumes changesets, so it is skipped.
  changeset:
    name: Changeset
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Changesets compares against the base branch
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter chassis-tokens-workspace

      - name: Check for a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since "origin/$BASE_REF"

  # What the pull request does to the tokens, in the job summary: the names added, removed,
  # renamed and changed in each dist/ file. It compares the committed dist/ of the test merge
  # commit with that of its first parent, the base branch; the Tokens job checks that both
  # equal a fresh build. Needs no install: build/diff.js uses Node.js only.
  token-diff:
    name: Token diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The merge commit and its parents
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Token diff report
        run: |
          node packages/tokens/build/diff.js --base HEAD^1 > "$RUNNER_TEMP/token-diff.md"
          cat "$RUNNER_TEMP/token-diff.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/token-diff.md"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Audit dependencies
        run: pnpm check:pnpm
