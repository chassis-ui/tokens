version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Minor and patch updates of the tooling in one pull request. The packages
      # that produce dist/ and the Chassis packages the site copies are left out:
      # they get a pull request each, since they can change the output.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - style-dictionary
          - '@tokens-studio/sd-transforms'
          - svg2vectordrawable
          - tinycolor2
          - '@chassis-ui/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
