version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Minor and patch updates of the tooling in one pull request. The packages
      # that produce dist/ and the Chassis packages the site copies are left out:
      # they get a pull request each, since they can change the output.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - style-dictionary
          - '@tokens-studio/sd-transforms'
          - svg2vectordrawable
          - tinycolor2
          - '@chassis-ui/*'

  # The Gradle project of the native compile checks: the Android Gradle plugin, Kotlin,
  # Compose and the Gradle wrapper
  - package-ecosystem: gradle
    directory: /packages/tokens/test/native/android
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      native-android:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
