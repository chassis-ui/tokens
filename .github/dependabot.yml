version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Dependabot waits 3 days after a release by default, and passes that on to pnpm as its
    # minimum release age when it re-resolves the lockfile, so a Chassis package that develop
    # already requires failed the whole run until it was 3 days old. Chassis releases can be
    # urgent fixes between our own packages: they are exempt here, and from pnpm's check in
    # pnpm-workspace.yaml. Everything else keeps the default.
    cooldown:
      default-days: 3
      exclude:
        - '@chassis-ui/*'
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # The build is type-checked against Node.js 22, the oldest version the package supports
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Minor and patch updates of the tooling in one pull request. The packages
      # that produce dist/ are left out: they get a pull request each, since they
      # can change the output. The Chassis packages have a group of their own.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - style-dictionary
          - '@tokens-studio/sd-transforms'
          - svg2vectordrawable
          - tinycolor2
          - '@chassis-ui/*'
      # A release of the Chassis packages the site copies, in one pull request
      chassis:
        patterns: ['@chassis-ui/*']

  # The Gradle project of the native compile checks: the Android Gradle plugin, Kotlin,
  # Compose and the Gradle wrapper
  - package-ecosystem: gradle
    directory: /packages/tokens/test/native/android
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      native-android:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
